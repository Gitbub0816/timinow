name: TimiNow
options:
  bundleIdPrefix: solutions.clearkey
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  TimiNowPackage:
    path: ..
# The iPhone app and its watch companion have to carry the same version pair,
# or App Store Connect rejects the upload. Set once, here, and read by
# Info.plist through $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION).
# scripts/upload-testflight.sh overrides CURRENT_PROJECT_VERSION per upload,
# since every build sent to TestFlight needs a higher one than the last.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimiNow:
    type: application
    platform: iOS
    sources:
      - Sources
      # Generated by scripts/apply-icon.sh from assets/timinow-icon.png.
      - path: Assets.xcassets
        optional: true
    dependencies:
      - package: TimiNowPackage
        product: TimiNowApp
      # Apple-only CarPlay support (Sources/TimiNowCarPlay). Never a
      # dependency of TimiNowUI/TimiNowApp, so this is the only place it is
      # linked — see Package.swift.
      - package: TimiNowPackage
        product: TimiNowCarPlay
      # Single-target watchOS companion app (../Watch). See
      # docs/NAVIGATION.md for how it pairs over WatchConnectivity.
      - target: TimiNowWatch
        embed: true
    configFiles:
      Debug: TimiNow.xcconfig
      Release: TimiNow.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: TimiNow
        # Spelled out, not derived. bundleIdPrefix + target name would give
        # solutions.clearkey.TimiNow, and three other places already say
        # solutions.clearkey.timinow: the launch in the build scripts, the
        # watch app's WKCompanionAppBundleIdentifier below, and the CarPlay
        # entitlement request. A capital T there means the app installs and
        # then cannot be launched by id, and the watch never pairs.
        PRODUCT_BUNDLE_IDENTIFIER: solutions.clearkey.timinow
        PRODUCT_MODULE_NAME: TimiNowHost
        CODE_SIGN_STYLE: Automatic
        # CODE_SIGN_ENTITLEMENTS is deliberately NOT set here. It lives in
        # TimiNow.xcconfig instead, because a target setting outranks the
        # xcconfig and scripts/install-ios-device.sh has to be able to point
        # this at a copy with the restricted CarPlay entitlement removed —
        # Apple issues no development profile carrying an entitlement it has
        # not granted, so a device build fails at signing without that. See
        # Darwin/TimiNow.entitlements and docs/NAVIGATION.md.
        # iPhone only. Including iPad ("1,2") obliges the bundle to either
        # support all four orientations or declare UIRequiresFullScreen —
        # App Store validation enforces it — and this UI is portrait iPhone.
        # iPads still run it in compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.9"
  TimiNowWatch:
    type: application
    platform: watchOS
    sources:
      - ../Watch
      # App Store validation refuses a watch app with no icon. actool compiles
      # this and writes CFBundleIconName into the generated Info.plist; a
      # device install never checks, so the gap only shows at upload.
      - path: WatchAssets.xcassets
    settings:
      base:
        PRODUCT_NAME: TimiNowWatch
        PRODUCT_BUNDLE_IDENTIFIER: solutions.clearkey.timinow.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: solutions.clearkey.timinow
        # Both portrait orientations: watchOS validation rejects portrait-only
        # (upside-down is how a watch renders on a wrist worn crown-left).
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_CFBundleDisplayName: "Tími"
schemes:
  TimiNow:
    build:
      targets:
        # TimiNowWatch is not listed: the TimiNow target already depends on it
        # with embed: true, so Xcode builds it for watchOS as part of this
        # scheme. Naming it here as well made it a top-level target of an iOS
        # build, and its sources then compiled against the iOS SDK — "no such
        # module 'WatchKit'".
        TimiNow: all
    run:
      config: Debug
    archive:
      config: Release
  TimiNowWatch:
    build:
      targets:
        TimiNowWatch: all
    run:
      config: Debug
    archive:
      config: Release
