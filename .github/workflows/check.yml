name: check

# The gate this repository did not have: every prior control (syntax,
# subprocessor/CSP sync, schema validation, smoke tests, every integration
# test) already existed as an npm script — see package.json's "check" —
# but nothing stopped a pull request from merging without running it. This
# workflow is that stop. See docs/SOC2-READINESS.md, CC5 (change management).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # This workflow ran for months without installing anything, because
      # every check script used only Node built-ins and so nothing noticed.
      # The first script to import a package (scripts/syntax.mjs, which uses
      # esbuild to catch duplicate object keys) turned the gate red, and it
      # stayed red for ten commits while `npm run check` kept passing locally
      # — where the package resolved as a Wrangler transitive dependency that
      # a fresh checkout does not have. A gate that cannot install what it
      # needs is not a gate.
      - run: npm ci
      - run: npm run check
