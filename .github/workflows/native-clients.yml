name: Native clients

on:
  push:
    branches: [main]
    paths:
      - "apps/customer-mobile/**"
      - "apps/customer-mobile/Watch/**"
      - "apps/vet-windows/**"
      - ".github/workflows/native-clients.yml"
  pull_request:
    paths:
      - "apps/customer-mobile/**"
      - "apps/customer-mobile/Watch/**"
      - "apps/vet-windows/**"
      - ".github/workflows/native-clients.yml"

permissions:
  contents: read

jobs:
  ios:
    name: Swift tests and iOS build
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer-mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install Skip Fuse Android toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          install-swift-android-sdk: "true"
          run-doctor: "false"
          verify-project: apps/customer-mobile
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/customer-mobile/Darwin
        run: xcodegen generate
      - name: Resolve Swift packages
        run: SKIP_BRIDGE=1 swift package resolve
      - name: Run core tests
        run: |
          set +e
          swift test --filter ConcernValidatorTests > "$RUNNER_TEMP/timi-swift-test.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            rg -i "error:|fatalerror|failed|unsatisfiedlink|exception" "$RUNNER_TEMP/timi-swift-test.log" | tail -200 || true
            tail -120 "$RUNNER_TEMP/timi-swift-test.log"
            exit "$status"
          fi
          tail -80 "$RUNNER_TEMP/timi-swift-test.log"
      - name: Upload Swift test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: ${{ runner.temp }}/timi-swift-test.log
          retention-days: 3
      - name: Compile iOS app
        run: >-
          xcodebuild
          -workspace Project.xcworkspace
          -scheme TimiNow
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  watch:
    name: watchOS companion app build
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer-mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install Skip Fuse Android toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          install-swift-android-sdk: "true"
          run-doctor: "false"
          verify-project: apps/customer-mobile
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/customer-mobile/Darwin
        run: xcodegen generate
      - name: Resolve Swift packages
        run: SKIP_BRIDGE=1 swift package resolve
      # The watchOS companion app (../Watch) is a plain Xcode target with no
      # SwiftPM dependency of its own (see docs/NAVIGATION.md), so it builds
      # standalone from the TimiNowWatch scheme. The TimiNow scheme's own
      # "Compile iOS app" step above already exercises TimiNowCarPlay and
      # the embedded TimiNowWatch target together, since both are wired
      # into Darwin/project.yml's TimiNow app target.
      - name: Compile watchOS companion app
        run: >-
          xcodebuild
          -workspace Project.xcworkspace
          -scheme TimiNowWatch
          -sdk watchsimulator
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/vet-windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore TimiVet.sln
      - name: Compile release build
        run: dotnet build TimiVet.sln -c Release --no-restore
