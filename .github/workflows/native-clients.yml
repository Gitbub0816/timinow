name: Native clients

on:
  # The working branches build too, not only main and open pull requests: a
  # merged pull request stops triggering anything, and a branch carrying
  # native changes with no way to build them is a branch nobody can trust.
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/customer-mobile/**"
      - "apps/vet-desktop/**"
      - "apps/vet-windows/**"
      - ".github/workflows/native-clients.yml"
  pull_request:
    paths:
      - "apps/customer-mobile/**"
      - "apps/vet-desktop/**"
      - "apps/vet-windows/**"
      - ".github/workflows/native-clients.yml"
  # Re-run the whole matrix on demand, for a fix whose commit touches nothing
  # under the paths above.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Swift tests and iOS build
    # macos-26, not macos-15, only because of Mapbox: its binary frameworks are
    # built with Swift 6.2 and cannot be read by the Swift 6.1 that ships in
    # macos-15's newest Xcode. The step below still probes for a new-enough
    # toolchain rather than assuming this one, so the job degrades to the
    # non-Mapbox path instead of breaking if the image changes under us.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer-mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install Skip Fuse Android toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          install-swift-android-sdk: "true"
          run-doctor: "false"
          verify-project: apps/customer-mobile
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/customer-mobile/Darwin
        run: xcodegen generate
      # The Mapbox SDKs are only fetched when a downloads token is configured;
      # without the secret the build takes the non-Mapbox fallback path, which
      # is what a fork or a first-time contributor gets.
      #
      # They also ship as binary frameworks, and a binary Swift module can only
      # be read by a compiler at least as new as the one that built it. Maps
      # 11.26 is built with Swift 6.2, so an older toolchain fails with
      #
      #   failed to build module 'MapboxCoreMaps'; this SDK is not supported by
      #   the compiler
      #
      # and then a cascade of missing types. Which Xcode versions a runner
      # image carries is not ours to pin, so this picks the newest installed
      # one and takes the documented non-Mapbox path when none is new enough,
      # rather than failing on somebody else's release schedule.
      - name: Configure Mapbox downloads
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          # Whatever happens below, later steps get a usable toolchain: an
          # empty DEVELOPER_DIR is worse than no DEVELOPER_DIR, because xcrun
          # honours it and then finds nothing.
          echo "MAPBOX_DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

          # ::warning:: rather than echo, and repeated on the job summary: a
          # green run that never compiled the Mapbox path reads exactly like a
          # green run that did, and the difference is a whole class of error
          # that then has nowhere to surface but somebody's laptop.
          fallback() {
            echo "::warning title=Mapbox path not compiled::$1"
            {
              echo "### Mapbox path NOT compiled"
              echo
              echo "$1"
              echo
              echo "Every Mapbox-only source in this repository went unchecked by this run."
              echo "Set the \`MAPBOX_DOWNLOADS_TOKEN\` repository secret to compile it here"
              echo "instead of on a developer's machine."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            fallback "No MAPBOX_DOWNLOADS_TOKEN secret is set, so this job built the non-Mapbox fallback."
            exit 0
          fi

          # Newest first, so the first new-enough one wins.
          chosen=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr || true); do
            version="$("$app/Contents/Developer/usr/bin/swift" --version 2>/dev/null \
              | grep -oE 'Apple Swift version [0-9]+\.[0-9]+' | awk '{ print $4 }' || true)"
            [ -n "$version" ] || continue
            echo "  $app: Swift $version"
            major="${version%%.*}"
            minor="${version#*.}"
            if [ "$major" -gt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -ge 2 ]; }; then
              chosen="$app/Contents/Developer"
              break
            fi
          done

          if [ -z "$chosen" ]; then
            fallback "No installed Xcode has Swift 6.2 or newer, which the Mapbox binary frameworks require."
            exit 0
          fi

          echo "Building with Mapbox against $chosen"
          echo "MAPBOX_DEVELOPER_DIR=$chosen" >> "$GITHUB_ENV"
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' \
            "$MAPBOX_DOWNLOADS_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          echo "TIMI_MAPBOX=1" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: SKIP_BRIDGE=1 swift package resolve
      - name: Run core tests
        run: |
          set +e
          swift test --filter ConcernValidatorTests > "$RUNNER_TEMP/timi-swift-test.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            rg -i "error:|fatalerror|failed|unsatisfiedlink|exception" "$RUNNER_TEMP/timi-swift-test.log" | tail -200 || true
            tail -120 "$RUNNER_TEMP/timi-swift-test.log"
            exit "$status"
          fi
          tail -80 "$RUNNER_TEMP/timi-swift-test.log"
      - name: Upload Swift test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: ${{ runner.temp }}/timi-swift-test.log
          retention-days: 3
      # skipstone is a SwiftPM build plugin, and xcodebuild refuses to run a
      # plugin that has not been trusted interactively — "Validate plug-in
      # skipstone in package skip" fails the build with no other explanation.
      - name: Compile iOS app
        env:
          DEVELOPER_DIR: ${{ env.MAPBOX_DEVELOPER_DIR }}
        run: >-
          xcodebuild
          -workspace Project.xcworkspace
          -scheme TimiNow
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          -skipPackagePluginValidation
          -skipMacroValidation
          build

  watch:
    name: watchOS companion app build
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/customer-mobile
    steps:
      - uses: actions/checkout@v5
      - name: Install Skip Fuse Android toolchain
        uses: skiptools/actions/setup-skip@v1
        with:
          install-swift-android-sdk: "true"
          run-doctor: "false"
          verify-project: apps/customer-mobile
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/customer-mobile/Darwin
        run: xcodegen generate
      - name: Resolve Swift packages
        run: SKIP_BRIDGE=1 swift package resolve
      # The watchOS companion app (../Watch) is a plain Xcode target with no
      # SwiftPM dependency of its own (see docs/NAVIGATION.md), so it builds
      # standalone from the TimiNowWatch scheme. The TimiNow scheme's own
      # "Compile iOS app" step above already exercises TimiNowCarPlay and
      # the embedded TimiNowWatch target together, since both are wired
      # into Darwin/project.yml's TimiNow app target.
      - name: Compile watchOS companion app
        run: >-
          xcodebuild
          -workspace Project.xcworkspace
          -scheme TimiNowWatch
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          -skipPackagePluginValidation
          -skipMacroValidation
          build

  vet-macos:
    name: macOS veterinary console build
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/vet-desktop
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/vet-desktop/Darwin
        run: xcodegen generate
      - name: Resolve Swift packages
        run: swift package resolve
      # The console is a plain macOS SwiftPM package — no Skip, no Kotlin, no
      # simulator — so the whole suite runs directly.
      - name: Run core tests
        run: |
          set +e
          swift test > "$RUNNER_TEMP/timi-vet-test.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -120 "$RUNNER_TEMP/timi-vet-test.log"
            exit "$status"
          fi
          tail -60 "$RUNNER_TEMP/timi-vet-test.log"
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vet-macos-test-log
          path: ${{ runner.temp }}/timi-vet-test.log
          retention-days: 3
      # The validation flags are carried by every xcodebuild here for
      # uniformity. They are no-ops for this package now that it has no build
      # plugins, and load-bearing for the customer app, which does.
      - name: Compile macOS app
        run: >-
          xcodebuild
          -workspace Project.xcworkspace
          -scheme TimiVet
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          -skipPackagePluginValidation
          -skipMacroValidation
          build

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/vet-windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          # Tracks apps/vet-windows/src/TimiVet/TimiVet.csproj's TargetFramework. A build against an older
          # SDK than the project targets fails with NETSDK1045, which reads as a broken project rather
          # than as a runner that needs a newer toolchain.
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore TimiVet.sln
      - name: Compile release build
        run: dotnet build TimiVet.sln -c Release --no-restore
